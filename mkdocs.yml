site_name: Commandeck
site_description: A visual command launcher for Linux, macOS and Windows — run local and SSH commands with one click.
site_url: https://commandeck.app
repo_url: https://github.com/neurocontrarian/commandeck
repo_name: neurocontrarian/commandeck

theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  font: false   # no Google Fonts — use system fonts (matches the home page, privacy-friendly)
  palette:
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/commandeck.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
